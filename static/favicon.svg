<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="dreamy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.35" stop-color="#f0abfc"/>
      <stop offset="0.7" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#dreamy)"/>

  <!-- 外圈 r=12 -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- 内圈 r=5 -->
  <circle cx="16" cy="16" r="5" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- 中心圆 -->
  <circle cx="16" cy="16" r="1.7" fill="white"/>

  <!-- 8 根辐条（端点外延到 r=13.5） -->
  <!-- 上 -->
  <line x1="16" y1="11" x2="16" y2="2.5" stroke="white" stroke-width="1.4"/>
  <!-- 下 -->
  <line x1="16" y1="21" x2="16" y2="29.5" stroke="white" stroke-width="1.4"/>
  <!-- 左 -->
  <line x1="11" y1="16" x2="2.5" y2="16" stroke="white" stroke-width="1.4"/>
  <!-- 右 -->
  <line x1="21" y1="16" x2="29.5" y2="16" stroke="white" stroke-width="1.4"/>
  <!-- 左上 -->
  <line x1="12.5" y1="12.5" x2="6.5" y2="6.5" stroke="white" stroke-width="1.4"/>
  <!-- 右下 -->
  <line x1="19.5" y1="19.5" x2="25.5" y2="25.5" stroke="white" stroke-width="1.4"/>
  <!-- 右上 -->
  <line x1="19.5" y1="12.5" x2="25.5" y2="6.5" stroke="white" stroke-width="1.4"/>
  <!-- 左下 -->
  <line x1="12.5" y1="19.5" x2="6.5" y2="25.5" stroke="white" stroke-width="1.4"/>

  <!-- 8 个外圆点（距离中心 13.5） -->
  <circle cx="16" cy="2.5" r="1.5" fill="white"/>
  <circle cx="16" cy="29.5" r="1.5" fill="white"/>
  <circle cx="2.5" cy="16" r="1.5" fill="white"/>
  <circle cx="29.5" cy="16" r="1.5" fill="white"/>

  <circle cx="6.5" cy="6.5" r="1.5" fill="white"/>
  <circle cx="25.5" cy="25.5" r="1.5" fill="white"/>
  <circle cx="25.5" cy="6.5" r="1.5" fill="white"/>
  <circle cx="6.5" cy="25.5" r="1.5" fill="white"/>
</svg>